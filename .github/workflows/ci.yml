name: DocuMind AI CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: documind_db
          MYSQL_USER: documind_user
          MYSQL_PASSWORD: documind_secure_password_2026
          MYSQL_ROOT_PASSWORD: root_password_2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements/dev.txt

    - name: Run Backend PyUnit/Django Test Suite
      env:
        SECRET_KEY: ci-test-secret-key-2026
        DEBUG: "False"
        DB_ENGINE: sqlite
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        python manage.py test tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Production Frontend Bundle
      run: |
        cd frontend
        npm run build
