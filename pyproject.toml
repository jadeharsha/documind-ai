[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "1.0.0"
description = "DocuMind AI — Intelligent Document Understanding, Research and Agentic Knowledge Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DocuMind AI Team" }
]
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.4.0",
    "PyMySQL>=1.1.1",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "minio>=7.2.8",
    "boto3>=1.35.0",
    "qdrant-client>=1.11.0",
    "PyMuPDF>=1.24.9",
    "python-docx>=1.1.2",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.20",
    "httpx>=0.27.0",
    "requests>=2.32.3",
    "numpy>=1.26.0",
    "whitenoise>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.1.0",
    "black>=24.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["backend"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
